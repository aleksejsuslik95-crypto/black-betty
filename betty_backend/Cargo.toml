[package]
name = "betty_backend"
version = "6.0.0"
edition = "2021"

[dependencies]
# Асинхронное ядро и потоки
tokio = { version = "1.38", features = ["full"] }
dotenvy = "0.15"

# Сеть и работа с WebSocket
tokio-tungstenite = "0.23"
futures-util = "0.3"

# Сериализация данных (работа с универсальным JSON)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- ДОБАВЛЯЕМ КРЭЙТЫ ЯДРА БЭТТИ ---
rand = "0.8"               # Чтобы работал .choose() для фраз soul.rs
sha2 = "0.10"              # Для Sha256 хэшей в context.rs
reqwest = { version = "0.12", features = ["json"] } # Для отправки промптов в Gemini
chrono = "0.4.45"
regex = "1.13.1"
