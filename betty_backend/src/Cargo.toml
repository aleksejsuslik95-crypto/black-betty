[package]
name = "iseeu"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.6", features = ["desktop", "web"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
cpal = "0.15"
hound = "3.5"
base64 = "0.22"


